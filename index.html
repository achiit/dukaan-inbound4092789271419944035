<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TuitionDesk</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F6FB;--card:#fff;--ink:#17233F;--mut:#68728A;--line:#E3E7F0;--acc:#17233F;--on:#fff;--hi:#F5A83A;--ok:#1E8A5A;--bad:#D3453C;--okb:#E0F3EA;--badb:#FBE6E4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1424;--card:#171F36;--ink:#EEF1F8;--mut:#9AA5BF;--line:#26304D;--acc:#F5A83A;--on:#17233F;--okb:#12362A;--badb:#40201F;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;padding-bottom:84px}
header{padding:18px 16px 6px}h1{margin:0;font-size:22px;font-weight:800}header p{margin:2px 0 0;color:var(--mut);font-size:13px}
main{padding:8px 16px;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.n{font-weight:600}.s{color:var(--mut);font-size:13px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font:inherit;font-weight:700;background:var(--acc);color:var(--on);cursor:pointer;text-align:center;text-decoration:none}
.btn.wa{background:#1FA855;color:#fff}.btn:active{transform:scale(.98)}
.pill{padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--badb);color:var(--bad);white-space:nowrap}
.pill.g{background:var(--okb);color:var(--ok)}
.pa{display:flex;gap:6px}.pa button{width:44px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--mut);font:inherit;font-weight:800;cursor:pointer}
.pa .p.on{background:var(--ok);border-color:var(--ok);color:#fff}.pa .a.on{background:var(--bad);border-color:var(--bad);color:#fff}
select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin-bottom:10px}
.big{font-size:28px;font-weight:800;line-height:1.1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{margin:0}
.bar{height:12px;border-radius:6px;background:var(--badb);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ok)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-size:11px;font-weight:600;padding:4px 0;cursor:pointer}
nav button b{display:block;font-size:19px;line-height:1.2}nav button.on{color:var(--ink)}nav button.on b{filter:none}
nav button.on span{border-bottom:2px solid var(--hi);padding-bottom:1px}
#sheet{position:fixed;inset:0;background:rgba(10,14,28,.55);display:none;align-items:flex-end;z-index:9}
#sheet.show{display:flex}#sheet>div{background:var(--bg);width:100%;max-height:80%;overflow:auto;border-radius:18px 18px 0 0;padding:16px;max-width:560px;margin:0 auto}
.snd{padding:8px 14px;border-radius:10px;background:#1FA855;color:#fff;font-weight:700;text-decoration:none;font-size:13px}.snd.d{background:var(--mut)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13px;z-index:10}
h2{font-size:16px;margin:14px 0 8px}
</style></head><body>
<header><h1>TuitionDesk</h1><p id="sub">Sharma Tuition Centre · Demo data</p></header>
<main id="v"></main>
<div id="sheet" onclick="if(event.target===this)closeSheet()"><div id="sb"></div></div>
<nav id="nav"></nav>
<script>
var CENTRE='Sharma Tuition Centre';
var S=[
{n:'Aarav Verma',cl:'9',ph:'919810000001',due:2500,late:12,sc:[62,68,71,66,74,78],att:92,hw:'Maths: Ex 5.2, Q1–10'},
{n:'Diya Gupta',cl:'9',ph:'919810000002',due:0,late:0,sc:[81,84,79,88,90,92],att:97,hw:'Science: Ch 6 notes'},
{n:'Kabir Singh',cl:'9',ph:'919810000003',due:5000,late:21,sc:[48,52,55,50,58,61],att:78,hw:'Maths: Ex 5.3, Q1–8'},
{n:'Ananya Iyer',cl:'9',ph:'919810000004',due:0,late:0,sc:[70,73,75,78,77,82],att:94,hw:'English: Letter writing'},
{n:'Rohan Mehta',cl:'9',ph:'919810000005',due:2500,late:5,sc:[58,60,57,63,66,64],att:85,hw:'Science: Diagram, Ch 6'},
{n:'Isha Patel',cl:'9',ph:'919810000006',due:0,late:0,sc:[76,79,82,80,85,87],att:96,hw:'Maths: Ex 5.2, Q1–10'},
{n:'Vihaan Khan',cl:'9',ph:'919810000007',due:7500,late:34,sc:[44,47,50,46,49,53],att:70,hw:'English: Grammar sheet 4'},
{n:'Meera Nair',cl:'9',ph:'919810000008',due:0,late:0,sc:[66,64,69,72,70,75],att:91,hw:'Science: Ch 6 notes'}];
var COLLECTED=41500,ENQ=[{n:'Parent of Sara Ali',by:'Referred by Diya Gupta',d:'Today'},{n:'Parent of Yash Kapoor',by:'Referred by Isha Patel',d:'Yesterday'},{n:'Parent of Tanvi Rao',by:'Referred by Aarav Verma',d:'2 days ago'}];
var TABS=[['fees','₹','Fees'],['att','✓','Attendance'],['tests','📊','Tests'],['parent','👪','Parent'],['own','🏠','Owner']];
var tab='fees',att=S.map(function(){return 'P'}),sel=0,sent={};
function inr(x){return '₹'+x.toLocaleString('en-IN')}
function wa(p,m){return 'https://wa.me/'+p+'?text='+encodeURIComponent(m)}
function toast(t){var e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(function(){e.remove()},2200)}
function openSheet(title,items){
  var h='<div class="row"><b style="font-size:17px">'+title+'</b><button class="snd d" onclick="closeSheet()">Close</button></div><p class="s">Tap Send for each parent. WhatsApp opens with the message ready.</p>';
  items.forEach(function(it,i){h+='<div class="card row"><div><div class="n">'+it.n+'</div><div class="s">'+it.m.slice(0,60)+'…</div></div><a class="snd" id="sd'+i+'" href="'+wa(it.p,it.m)+'" target="_blank" rel="noopener" onclick="this.className=\'snd d\';this.textContent=\'Sent\'">Send</a></div>'});
  document.getElementById('sb').innerHTML=h;document.getElementById('sheet').className='show'}
function closeSheet(){document.getElementById('sheet').className=''}
function sendAllFees(){var it=S.filter(function(s){return s.due>0}).map(function(s){return{n:s.n,p:s.ph,m:'Namaste! Reminder from '+CENTRE+': '+s.n+'’s fee of '+inr(s.due)+' is pending for '+s.late+' days. Please pay at the earliest. Thank you!'}});openSheet('Fee reminders ('+it.length+')',it)}
function setA(i,v){att[i]=v;render()}
function saveAtt(){var it=[];S.forEach(function(s,i){if(att[i]==='A')it.push({n:s.n,p:s.ph,m:'Namaste! '+s.n+' was absent from today’s batch at '+CENTRE+'. Please let us know if all is well.'})});
  if(!it.length){toast('Saved. Everyone is present today');return}toast('Attendance saved');openSheet('Absent alerts ('+it.length+')',it)}
function rank(i){var l=S.map(function(s){return s.sc[5]}).sort(function(a,b){return b-a});return l.indexOf(S[i].sc[5])+1}
function shareTest(){var s=S[sel];window.open(wa('','Weekly test report – '+s.n+'\nScore: '+s.sc[5]+'/100\nClass rank: '+rank(sel)+' of '+S.length+'\nLast 6 tests: '+s.sc.join(', ')+'\n– '+CENTRE),'_blank')}
function chart(a,mx){var w=300,h=140,bw=30,g=(w-bw*a.length)/(a.length+1),o='<svg viewBox="0 0 '+w+' '+(h+24)+'" width="100%" role="img" aria-label="Last 6 test scores">';
  a.forEach(function(v,i){var bh=v/mx*h,x=g+i*(bw+g),last=i===a.length-1;o+='<rect x="'+x+'" y="'+(h-bh)+'" width="'+bw+'" height="'+bh+'" rx="5" fill="'+(last?'var(--hi)':'var(--mut)')+'" opacity="'+(last?1:.55)+'"/><text x="'+(x+bw/2)+'" y="'+(h-bh-5)+'" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">'+v+'</text><text x="'+(x+bw/2)+'" y="'+(h+16)+'" text-anchor="middle" font-size="11" fill="var(--mut)">T'+(i+1)+'</text>'});return o+'</svg>'}
function opts(){return '<select onchange="sel=+this.value;render()">'+S.map(function(s,i){return '<option value="'+i+'"'+(i===sel?' selected':'')+'>'+s.n+'</option>'}).join('')+'</select>'}
var V={
fees:function(){var p=S.filter(function(s){return s.due>0}).sort(function(a,b){return b.late-a.late}),t=p.reduce(function(a,s){return a+s.due},0);
  return '<div class="card"><div class="s">Pending this month</div><div class="big">'+inr(t)+'</div><div class="s">'+p.length+' students</div></div><button class="btn wa" onclick="sendAllFees()">Send WhatsApp reminder to all</button><h2>Pending fees</h2>'+
  p.map(function(s){return '<div class="card row"><div><div class="n">'+s.n+'</div><div class="s">'+inr(s.due)+' due</div></div><span class="pill">'+s.late+' days late</span></div>'}).join('')},
att:function(){var a=att.filter(function(x){return x==='A'}).length;
  return '<div class="card row"><div><div class="n">Class 9 · Maths batch</div><div class="s">Today, 5:00 PM</div></div><span class="pill '+(a?'':'g')+'">'+a+' absent</span></div>'+
  S.map(function(s,i){return '<div class="card row"><div class="n">'+s.n+'</div><div class="pa"><button class="p'+(att[i]==='P'?' on':'')+'" onclick="setA('+i+',\'P\')">P</button><button class="a'+(att[i]==='A'?' on':'')+'" onclick="setA('+i+',\'A\')">A</button></div></div>'}).join('')+'<button class="btn" onclick="saveAtt()">Save and alert parents of absentees</button>'},
tests:function(){var s=S[sel],d=s.sc[5]-s.sc[4];
  return opts()+'<div class="grid"><div class="card"><div class="s">This week</div><div class="big">'+s.sc[5]+'<span class="s">/100</span></div><div class="s" style="color:var(--'+(d>=0?'ok':'bad')+')">'+(d>=0?'▲ ':'▼ ')+Math.abs(d)+' vs last test</div></div><div class="card"><div class="s">Class rank</div><div class="big">#'+rank(sel)+'</div><div class="s">of '+S.length+' students</div></div></div><h2>Last 6 tests</h2><div class="card">'+chart(s.sc,100)+'</div><button class="btn wa" onclick="shareTest()">Share report on WhatsApp</button>'},
parent:function(){var s=S[sel],hwl=[s.hw,'Revise last week’s test mistakes'];
  return opts()+'<div class="card"><div class="s">Attendance</div><div class="big">'+s.att+'%</div><div class="bar"><i style="width:'+s.att+'%"></i></div><div class="s">'+(s.att>=90?'Great, keep it up':'Please try to attend every class')+'</div></div><div class="card"><div class="n">Homework</div>'+hwl.map(function(h){return '<div class="s" style="margin-top:6px">• '+h+'</div>'}).join('')+'</div>'+
  (s.due>0?'<div class="card"><div class="s">Fee due</div><div class="big">'+inr(s.due)+'</div><div class="s" style="margin-bottom:10px">'+s.late+' days late</div><a class="btn" href="upi://pay?pa=sharmatuition@upi&pn='+encodeURIComponent(CENTRE)+'&am='+s.due+'&cu=INR&tn=Tuition%20fee" >Pay by UPI</a></div>':'<div class="card row"><div><div class="s">Fee status</div><div class="n">No fee due</div></div><span class="pill g">Paid</span></div>')},
own:function(){var p=S.reduce(function(a,s){return a+s.due},0),pc=Math.round(COLLECTED/(COLLECTED+p)*100);
  return '<div class="grid"><div class="card"><div class="s">Collected</div><div class="big" style="color:var(--ok)">'+inr(COLLECTED)+'</div></div><div class="card"><div class="s">Pending</div><div class="big" style="color:var(--bad)">'+inr(p)+'</div></div><div class="card"><div class="s">Students</div><div class="big">'+S.length+'</div></div><div class="card"><div class="s">New enquiries</div><div class="big">'+ENQ.length+'</div></div></div><div class="card" style="margin-top:10px"><div class="row"><span class="n">Fees collected</span><span class="s">'+pc+'%</span></div><div class="bar"><i style="width:'+pc+'%"></i></div></div><h2>New referral enquiries</h2>'+
  ENQ.map(function(e){return '<div class="card row"><div><div class="n">'+e.n+'</div><div class="s">'+e.by+'</div></div><span class="s">'+e.d+'</span></div>'}).join('')}};
function render(){document.getElementById('v').innerHTML=V[tab]();
  document.getElementById('nav').innerHTML=TABS.map(function(t){return '<button class="'+(t[0]===tab?'on':'')+'" onclick="go(\''+t[0]+'\')"><b>'+t[1]+'</b><span>'+t[2]+'</span></button>'}).join('')}
function go(t){tab=t;render();window.scrollTo(0,0)}
render();
</script></body></html>
